<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="$base">
<link rel="stylesheet" href="card.css">
</head>
<body>
<div class="card" style="--background: url('../$background'); --accent: $accent; --accent-soft: $accent_soft">
  <div class="content">
    <h1 class="title">$title</h1>
    <p class="period">$period</p>
    <div class="stats">$stats</div>
    <div class="heatmap">$heatmap</div>
    <p class="line">$tools</p>
    <p class="line">$languages</p>
    <div class="badges">$badges</div>
    <p class="footer">bonfire · Claude Code</p>
  </div>
</div>
</body>
</html>
